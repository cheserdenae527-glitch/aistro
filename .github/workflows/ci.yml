name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start local services
        run: |
          cp backend/.env.example backend/.env
          docker compose up -d postgres redis minio
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U aistro && break
            sleep 1
          done
          docker compose exec -T postgres createdb -U aistro aistro_test || true

      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements-lint.txt
          cd backend
          python -m ruff check app tests scripts benchmarks alembic/env.py
          python -m mypy --config-file mypy.ini
          bandit -r app -q -ll
          python -m pip_audit -r requirements.txt --progress-spinner off --ignore-vuln PYSEC-2026-1325
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=60 -q

      - name: Frontend tests
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Frontend build
        run: |
          cd frontend
          npm run build

      - name: Frontend dependency audit (report only)
        run: |
          cd frontend
          npm audit --registry=https://registry.npmjs.org --audit-level=high || true

      - name: Playwright E2E
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run e2e
