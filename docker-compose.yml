services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aistro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aistro}
      POSTGRES_DB: aistro
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aistro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-aistro-redis-dev}"]
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/services/crawler/xhs/scripts/payload_user.json:/app/services/crawler/xhs/scripts/payload_user.json:ro
      - ./backend/services/crawler/xhs/scripts/crawler_config.json:/app/services/crawler/xhs/scripts/crawler_config.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://aistro:${POSTGRES_PASSWORD:-aistro}@postgres:5432/aistro
      # SECRET_KEY/DEBUG 来自 env_file（backend/.env），云主机必须覆盖
      CORS_ORIGINS: '["http://localhost:3000","http://localhost"]'
      REDIS_URL: redis://:${REDIS_PASSWORD:-aistro-redis-dev}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  minio_data:
