<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Editorial Card</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
:root { ${theme_css} --serif-zh: "Noto Serif SC", "Songti SC", "STSong", serif; --serif-en: "Playfair Display", "Noto Serif SC", serif; --sans-zh: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; margin: 0; padding: 0; background: #1a1a1a; }
.poster { width: 1080px; height: 1440px; background: var(--paper); color: var(--ink); font-family: var(--serif-zh); position: relative; overflow: hidden; }
.poster .content { display: flex; flex-direction: column; height: 100%; padding: 88px 80px 88px; }
.kicker { display: flex; align-items: center; gap: 16px; font-family: var(--serif-zh); font-size: 26px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.kicker .rule { flex: 1; height: 2px; background: var(--accent); opacity: .55; }
.cover-title { margin-top: 32px; font-family: var(--serif-zh); font-weight: 900; font-size: 96px; line-height: 1.14; letter-spacing: .01em; }
.cover-title em { font-style: normal; color: var(--accent); }
.cover-lead { margin-top: 20px; font-size: 30px; line-height: 1.5; color: var(--muted); font-weight: 400; }
.image-frame { margin-top: 28px; flex: 1; min-height: 0; position: relative; background: var(--paper-2); overflow: hidden; }
.image-frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.image-frame .img-note { position: absolute; left: 24px; bottom: 20px; background: rgba(0,0,0,.55); color: #fff; font-size: 22px; padding: 8px 18px; border-radius: 999px; font-family: var(--sans-zh); }
.cover-panel { margin-top: 28px; background: var(--accent-soft); padding: 28px 28px 24px; }
.cover-panel .bullets { display: flex; flex-wrap: wrap; gap: 14px; }
.cover-panel .bullets .chip { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-family: var(--sans-zh); font-size: 26px; line-height: 1.2; padding: 16px 22px; border-radius: 999px; }
.cover-panel .foot { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; font-family: var(--serif-en); font-size: 24px; color: var(--muted); letter-spacing: .08em; }
.cover-panel .foot .brand { font-family: var(--serif-zh); font-weight: 500; color: var(--ink); }
.page-title { margin-top: 36px; font-family: var(--serif-zh); font-weight: 700; font-size: 80px; line-height: 1.2; }
.page-title em { font-style: normal; color: var(--accent); }
.content-row { display: flex; gap: 40px; flex: 1; min-height: 0; margin-top: 36px; }
.text-col { flex: 1.12; display: flex; flex-direction: column; min-width: 0; }
.content-bullets { display: flex; flex-direction: column; gap: 26px; }
.content-bullets li { list-style: none; display: flex; gap: 20px; align-items: flex-start; font-size: 34px; line-height: 1.5; font-weight: 400; }
.content-bullets li .num { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--paper); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-family: var(--serif-en); font-weight: 700; margin-top: 6px; }
.content-bullets li span.txt { flex: 1; }
.img-col { flex: 1; min-width: 0; position: relative; background: var(--paper-2); overflow: hidden; }
.img-col img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.content-foot { margin-top: 28px; padding-top: 20px; border-top: 3px solid var(--accent); display: flex; align-items: center; justify-content: space-between; font-family: var(--serif-en); font-size: 24px; color: var(--muted); letter-spacing: .08em; }
.content-foot .brand { font-family: var(--serif-zh); font-weight: 500; color: var(--ink); }
</style>
</head>
<body>
<section class="poster xhs">
  <div class="content">
    ${kicker_html}
    ${title_html}
    ${lead_html}
    ${image_html}
    ${bullets_html}
  </div>
</section>
</body>
</html>
