<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Swiss Card</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root { ${theme_css} --sans-zh: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; --sans-en: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; margin: 0; padding: 0; background: #1a1a1a; }
.poster { width: 1080px; height: 1440px; background: var(--paper); color: var(--ink); font-family: var(--sans-zh); position: relative; overflow: hidden; }
.poster .content { display: flex; flex-direction: column; height: 100%; padding: 88px 80px 88px; }
.mono-top { display: flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 26px; letter-spacing: .1em; color: var(--grey-3); }
.mono-top .sq { width: 24px; height: 24px; background: var(--accent); flex: none; }
.mono-top .line { flex: 1; height: 5px; background: var(--accent); }
.swiss-cover-title { margin-top: 40px; font-family: var(--sans-zh); font-weight: 300; font-size: 112px; line-height: 1.08; letter-spacing: -.01em; }
.swiss-cover-title b { font-weight: 300; color: var(--accent); }
.swiss-cover-lead { margin-top: 20px; font-family: var(--sans-en); font-size: 32px; font-weight: 400; color: var(--grey-3); letter-spacing: .02em; }
.swiss-image { margin-top: 32px; flex: 1; min-height: 0; position: relative; background: var(--grey-1); overflow: hidden; border: 3px solid var(--accent); }
.swiss-image img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.swiss-cover-panel { margin-top: 28px; background: var(--accent); color: var(--accent-on); padding: 30px 28px 26px; }
.swiss-cover-panel .swiss-bullets { display: flex; flex-wrap: wrap; gap: 16px; }
.swiss-cover-panel .swiss-bullets .chip { background: var(--paper); color: var(--ink); font-family: var(--sans-zh); font-size: 28px; line-height: 1.2; padding: 18px 26px; }
.swiss-cover-panel .swiss-foot { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: space-between; font-family: var(--mono); font-size: 23px; color: var(--accent-on); letter-spacing: .08em; opacity: .92; }
.swiss-cover-panel .swiss-foot .brand { font-family: var(--sans-zh); font-weight: 500; }
.swiss-page-title { margin-top: 36px; font-family: var(--sans-zh); font-weight: 400; font-size: 84px; line-height: 1.14; }
.swiss-page-title b { font-weight: 400; color: var(--accent); }
.content-row { display: flex; gap: 40px; flex: 1; min-height: 0; margin-top: 40px; }
.text-col { flex: 1.12; display: flex; flex-direction: column; min-width: 0; }
.swiss-list { display: flex; flex-direction: column; gap: 30px; }
.swiss-list li { list-style: none; display: flex; gap: 22px; align-items: flex-start; font-size: 36px; line-height: 1.45; font-weight: 400; }
.swiss-list li::before { content: ""; flex: none; width: 26px; height: 26px; background: var(--accent); margin-top: 18px; }
.swiss-list li span.txt { flex: 1; }
.swiss-list li .idx { font-family: var(--mono); font-size: 23px; color: var(--grey-3); margin-top: 14px; }
.img-col { flex: 1; min-width: 0; position: relative; background: var(--grey-1); overflow: hidden; border: 3px solid var(--accent); }
.img-col img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.swiss-content-foot { margin-top: 28px; background: var(--accent); color: var(--accent-on); padding: 24px 28px; display: flex; align-items: center; justify-content: space-between; font-family: var(--mono); font-size: 23px; letter-spacing: .08em; }
.swiss-content-foot .brand { font-family: var(--sans-zh); font-weight: 500; }
</style>
</head>
<body>
<section class="poster xhs">
  <div class="content">
    ${kicker_html}
    ${title_html}
    ${lead_html}
    ${image_html}
    ${bullets_html}
  </div>
</section>
</body>
</html>
